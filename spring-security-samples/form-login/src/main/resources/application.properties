spring.application.name=form-login


# spring security user,password, role config


# enable this only when you don't create a bean for user details service
# otherwise this config will be overridden by that bean

#spring.security.user.name=user
#spring.security.user.password=password
#spring.security.user.roles=USER


# Session timeout (can be specified in seconds, minutes, etc.)
server.servlet.session.timeout=30m

# Name of the session cookie
server.servlet.session.cookie.name=JSESSIONID

# Whether to use HTTP-only cookies
server.servlet.session.cookie.http-only=true

# Whether to use secure cookies (HTTPS only)
server.servlet.session.cookie.secure=true

# Session tracking modes (optional: can be COOKIE, URL)
server.servlet.session.tracking-modes=cookie
